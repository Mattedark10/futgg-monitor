name: Update FC27 Players

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update players database
        run: python scripts/update_players.py

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet -- docs/players.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit database
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "FutFlex Bot"
          git config user.email "futflex@users.noreply.github.com"

          git add docs/players.json
          git commit -m "Update FC27 players database"
          git push
