name: Update FC27 Players

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update players database
        run: |
          python scripts/update_players.py

      - name: Verify players database
        run: |
          echo "Checking docs/players.json..."

          if [ ! -f "docs/players.json" ]; then
            echo "ERROR: docs/players.json does not exist!"
            exit 1
          fi

          echo "File found:"
          ls -lh docs/players.json

          python - <<'PY'
          import json

          with open("docs/players.json", encoding="utf-8") as f:
              data = json.load(f)

          count = data.get("count", 0)

          print(f"Players found: {count}")

          if count < 1000:
              raise SystemExit(
                  f"ERROR: only {count} players found"
              )

          print("Database verification: OK")
          PY

      - name: Show Git changes
        run: |
          echo "Git status:"
          git status --short

      - name: Commit and push database
        run: |
          git config user.name "FutFlex Bot"
          git config user.email "futflex@users.noreply.github.com"

          git add docs/players.json

          echo "Staged changes:"
          git status --short

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update FC27 players database"
            git push origin HEAD:main
          fi
