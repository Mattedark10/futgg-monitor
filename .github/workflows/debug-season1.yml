name: Debug Season 1 Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-season1:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Extract Season 1 embedded data
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          URL = "https://www.fut.gg/fut-gallery/rarities/season-1/"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              )
          }

          response = requests.get(
              URL,
              headers=HEADERS,
              timeout=30,
          )

          response.raise_for_status()

          soup = BeautifulSoup(
              response.text,
              "html.parser",
          )

          scripts = soup.find_all("script")

          print("=" * 80)
          print("FUTFLEX - SEASON 1 EMBEDDED DATA DEBUG")
          print("=" * 80)

          target_script = None

          for script in scripts:
              content = (
                  script.string
                  or script.get_text()
                  or ""
              )

              if (
                  "$_TSR.router" in content
                  and "season-1" in content
              ):
                  target_script = content
                  break

          if not target_script:
              raise SystemExit(
                  "ERROR: FUT.GG embedded router data not found."
              )

          print()
          print(
              f"Router script size: "
              f"{len(target_script):,} characters"
          )

          # ==================================================
          # SEARCH TERMS
          # ==================================================

          search_terms = [
              "67348095",
              "67368151",
              "67188263",
              "67368429",
              "50590935",
              "67353040",
              "67372629",
              "67386815",
              "lineup",
              "cheapestLineup",
              "cheapest",
              "hyperCosmeticType",
              "hyper_cosmetic_type",
              "holographic",
          ]

          # ==================================================
          # PRINT CONTEXT
          # ==================================================

          for term in search_terms:

              print()
              print("=" * 80)
              print(f"SEARCH: {term}")
              print("=" * 80)

              matches = list(
                  re.finditer(
                      re.escape(term),
                      target_script,
                      re.I,
                  )
              )

              print(
                  f"Occurrences: {len(matches)}"
              )

              for number, match in enumerate(
                  matches[:10],
                  start=1,
              ):
                  start = max(
                      0,
                      match.start() - 1500,
                  )

                  end = min(
                      len(target_script),
                      match.end() + 2500,
                  )

                  snippet = target_script[
                      start:end
                  ]

                  print()
                  print("-" * 80)
                  print(
                      f"{term} - MATCH {number}"
                  )
                  print("-" * 80)
                  print(snippet)

          # ==================================================
          # FIND ALL FC ITEM IDS
          # ==================================================

          print()
          print("=" * 80)
          print("ALL POSSIBLE ITEM IDS")
          print("=" * 80)

          item_ids = sorted(
              set(
                  re.findall(
                      r"\b(?:50|67)\d{6}\b",
                      target_script,
                  )
              )
          )

          for item_id in item_ids:
              print(item_id)

          print()
          print(
              f"Total possible item IDs: "
              f"{len(item_ids)}"
          )

          # ==================================================
          # SEARCH FOR PLAYER OBJECTS
          # ==================================================

          print()
          print("=" * 80)
          print("PLAYER OBJECT KEYWORDS")
          print("=" * 80)

          patterns = [
              r"hyperCosmeticType",
              r"cosmeticType",
              r"playerItem",
              r"itemId",
              r"resourceId",
              r"definitionId",
              r"baseDefId",
              r"cheapestLineup",
              r"lineup",
          ]

          for pattern in patterns:

              matches = list(
                  re.finditer(
                      pattern,
                      target_script,
                      re.I,
                  )
              )

              print()
              print(
                  f"{pattern}: "
                  f"{len(matches)} occurrence(s)"
              )

              for match in matches[:5]:
                  start = max(
                      0,
                      match.start() - 500,
                  )

                  end = min(
                      len(target_script),
                      match.end() + 1000,
                  )

                  print()
                  print(
                      target_script[
                          start:end
                      ]
                  )

                  print(
                      "-" * 40
                  )

          print()
          print("=" * 80)
          print("DEBUG COMPLETED")
          print("=" * 80)
          PY
