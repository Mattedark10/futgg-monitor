name: Debug Season 1 Short

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Short debug
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://www.fut.gg/fut-gallery/rarities/season-1/"

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          html = requests.get(
              url,
              headers=headers,
              timeout=30
          ).text

          soup = BeautifulSoup(
              html,
              "html.parser"
          )

          # Find FUT.GG embedded application data.
          data = ""

          for script in soup.find_all("script"):
              text = script.get_text() or ""

              if (
                  "$_TSR.router" in text
                  and "season-1" in text
              ):
                  data = text
                  break

          if not data:
              raise SystemExit(
                  "Embedded FUT.GG data not found."
              )

          print("")
          print("=== FUTFLEX SHORT DEBUG ===")
          print("")

          # Known cards currently visible in the lineup.
          ids = [
              "67348095",
              "67368151",
              "67188263",
              "67368429",
              "50590935",
              "67353040",
              "67372629",
              "67386815",
          ]

          for item_id in ids:

              pos = data.find(item_id)

              print(
                  f"ITEM {item_id}"
              )

              if pos == -1:
                  print("NOT FOUND")
                  print("")
                  continue

              start = max(
                  0,
                  pos - 250
              )

              end = min(
                  len(data),
                  pos + 500
              )

              text = data[start:end]

              # Collapse everything to one line.
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              print(text)
              print("")

          print(
              "=== HOLOGRAPHIC DATA ==="
          )

          matches = list(
              re.finditer(
                  r"hyperCosmeticType",
                  data,
                  re.I
              )
          )

          print(
              f"FOUND: {len(matches)}"
          )

          # Only show the first 10.
          for number, match in enumerate(
              matches[:10],
              start=1
          ):
              start = max(
                  0,
                  match.start() - 150
              )

              end = min(
                  len(data),
                  match.end() + 250
              )

              text = data[start:end]

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              print("")
              print(
                  f"HOLO {number}:"
              )
              print(text)

          print("")
          print("=== END ===")
          PY
