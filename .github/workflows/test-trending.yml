name: FutFlex Trending & Price History

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futflex-trending
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Update Trending & Price History
        run: python trending.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/trending.json docs/price_history.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update FutFlex market data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
