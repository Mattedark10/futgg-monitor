name: FutFlex Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: futflex-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run FutFlex monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save feed state
        run: |
          if [ ! -f "feed_state.json" ]; then
            echo "feed_state.json was not found."
            exit 0
          fi

          git config user.name "FutFlex Bot"
          git config user.email "futflex@users.noreply.github.com"

          git add feed_state.json

          if git diff --cached --quiet; then
            echo "Feed state has not changed."
          else
            git commit -m "Update FutFlex feed state"

            git pull --rebase origin main

            git push origin HEAD:main
          fi
