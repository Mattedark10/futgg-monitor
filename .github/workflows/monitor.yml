name: FUT.GG Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Controlla FUT.GG
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva lineup attuale
        run: |
          if [ -f players.json ]; then
            git config user.name "FUT.GG Monitor"
            git config user.email "actions@github.com"
            git add players.json
            git diff --cached --quiet || git commit -m "Update FUT.GG lineup"
            git push
          fi
