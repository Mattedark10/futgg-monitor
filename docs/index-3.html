<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>FutFlex</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
    --bg: #07090d;
    --panel: #0d1118;
    --panel2: #111722;
    --border: rgba(255,255,255,.08);
    --text: #f5f7fb;
    --muted: #8c95a5;
    --accent: #7c5cff;
    --accent2: #00e5ff;
    --green: #36e28b;
    --red: #ff5571;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(124,92,255,.18),
            transparent 42%
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    min-height: 100vh;
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 720px;
    margin: auto;
    padding: 18px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 26px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: var(--accent2);
}

.credit {
    color: var(--muted);
    font-size: 12px;
}

.hero {
    padding: 26px 22px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background:
        linear-gradient(
            135deg,
            rgba(124,92,255,.13),
            rgba(0,229,255,.035)
        ),
        var(--panel);
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
    margin-bottom: 20px;
}

.live {
    color: var(--green);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
}

.hero h1 {
    margin: 0;
    font-size: 31px;
    letter-spacing: -1.4px;
}

.hero p {
    color: var(--muted);
    line-height: 1.5;
    margin: 10px 0 0;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 2px 12px;
}

.section-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .5px;
}

.refresh {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
}

.players {
    display: grid;
    gap: 10px;
}

.player {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px;
    border-radius: 17px;
    border: 1px solid var(--border);
    background: rgba(13,17,24,.86);
    cursor: pointer;
    transition: .18s ease;
}

.player:active {
    transform: scale(.985);
}

.player:hover {
    border-color: rgba(124,92,255,.4);
    transform: translateY(-1px);
}

.rank {
    width: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
}

.card-img {
    width: 65px;
    height: 82px;
    object-fit: contain;
    flex-shrink: 0;
}

.player-info {
    min-width: 0;
    flex: 1;
}

.player-name {
    font-weight: 800;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.price {
    text-align: right;
    font-size: 13px;
    font-weight: 800;
}

.arrow {
    color: var(--accent2);
    font-size: 18px;
}

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 30px 0 12px;
}

/* DETAIL */

.detail {
    display: none;
}

.back {
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 0;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 20px;
}

.detail-card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 25px;
    padding: 22px;
}

.player-top {
    display: flex;
    align-items: center;
    gap: 18px;
}

.detail-image {
    width: 125px;
    height: 155px;
    object-fit: contain;
}

.detail-name {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1px;
}

.detail-meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.5;
}

.market {
    margin-top: 25px;
    padding: 18px;
    border-radius: 18px;
    background: var(--panel2);
}

.current-price {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -1px;
}

.change {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 800;
}

.change.up {
    color: var(--green);
}

.change.down {
    color: var(--red);
}

.change.neutral {
    color: var(--muted);
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 20px;
}

.tab {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 10px 4px;
    border-radius: 11px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
}

.tab.active {
    background: rgba(124,92,255,.17);
    color: white;
    border-color: rgba(124,92,255,.45);
}

.chart-wrap {
    margin-top: 15px;
    height: 230px;
    position: relative;
}

.chart {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.chart-line {
    fill: none;
    stroke: var(--accent2);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.chart-area {
    fill: url(#areaGradient);
    opacity: .28;
}

.chart-grid {
    stroke: rgba(255,255,255,.055);
    stroke-width: 1;
}

.chart-point {
    fill: var(--accent2);
}

.chart-label {
    fill: var(--muted);
    font-size: 9px;
}

.empty {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 20px;
}

.loading {
    text-align: center;
    color: var(--muted);
    padding: 35px;
}

@media (max-width: 430px) {
    .app {
        padding: 14px;
    }

    .hero h1 {
        font-size: 27px;
    }

    .detail-image {
        width: 105px;
        height: 135px;
    }

    .detail-name {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">Fut<span>Flex</span></div>
        <div class="credit">@Mattedark10</div>
    </header>

    <!-- LIST -->

    <main id="home">

        <section class="hero">
            <div class="live">● LIVE MARKET</div>
            <h1>Trending Players</h1>
            <p>
                Track real-time player trends and your own price history.
            </p>
        </section>

        <div class="section-head">
            <div class="section-title">TOP TRENDING</div>
            <button class="refresh" id="refreshBtn">
                Refresh
            </button>
        </div>

        <div id="players" class="players">
            <div class="loading">
                Loading market...
            </div>
        </div>

        <div class="footer">
            FutFlex · @Mattedark10
        </div>

    </main>

    <!-- DETAIL -->

    <main id="detail" class="detail">

        <button class="back" id="backBtn">
            ← Back
        </button>

        <section class="detail-card">

            <div class="player-top">

                <img
                    id="detailImage"
                    class="detail-image"
                    src=""
                    alt=""
                >

                <div>
                    <div id="detailName" class="detail-name"></div>

                    <div id="detailMeta" class="detail-meta"></div>
                </div>

            </div>

            <div class="market">

                <div id="currentPrice" class="current-price">
                    —
                </div>

                <div id="change" class="change neutral">
                    No history yet
                </div>

            </div>

            <div class="tabs">

                <button
                    class="tab active"
                    data-period="6"
                >
                    6H
                </button>

                <button
                    class="tab"
                    data-period="12"
                >
                    12H
                </button>

                <button
                    class="tab"
                    data-period="24"
                >
                    24H
                </button>

                <button
                    class="tab"
                    data-period="72"
                >
                    3 DAYS
                </button>

            </div>

            <div class="chart-wrap">
                <svg
                    id="chart"
                    class="chart"
                    viewBox="0 0 600 230"
                    preserveAspectRatio="none"
                ></svg>
            </div>

        </section>

        <div class="footer">
            FutFlex · @Mattedark10
        </div>

    </main>

</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

const playersEl = document.getElementById("players");
const homeEl = document.getElementById("home");
const detailEl = document.getElementById("detail");

const detailImage = document.getElementById("detailImage");
const detailName = document.getElementById("detailName");
const detailMeta = document.getElementById("detailMeta");
const currentPrice = document.getElementById("currentPrice");
const changeEl = document.getElementById("change");
const chart = document.getElementById("chart");

let players = [];
let history = {};
let selectedPlayer = null;
let selectedPeriod = 6;


function formatPrice(value) {
    if (value === null || value === undefined) {
        return "—";
    }

    const number = Number(value);

    if (!Number.isFinite(number) || number <= 0) {
        return "—";
    }

    return number.toLocaleString("en-US") + " coins";
}


function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


async function loadData() {

    try {

        const cacheBust = Date.now();

        const [
            playersResponse,
            historyResponse
        ] = await Promise.all([
            fetch(`trending.json?t=${cacheBust}`, {
                cache: "no-store"
            }),
            fetch(`price_history.json?t=${cacheBust}`, {
                cache: "no-store"
            })
        ]);

        if (!playersResponse.ok) {
            throw new Error("Trending data unavailable");
        }

        players = await playersResponse.json();

        if (historyResponse.ok) {
            history = await historyResponse.json();
        } else {
            history = {};
        }

        renderPlayers();

    } catch (error) {

        console.error(error);

        playersEl.innerHTML = `
            <div class="loading">
                Unable to load market data.
            </div>
        `;
    }
}


function renderPlayers() {

    if (!players.length) {
        playersEl.innerHTML = `
            <div class="loading">
                No trending players.
            </div>
        `;
        return;
    }

    playersEl.innerHTML = players
        .map((player, index) => {

            return `
                <article
                    class="player"
                    data-id="${escapeHtml(player.eaId)}"
                >

                    <div class="rank">
                        ${index + 1}
                    </div>

                    <img
                        class="card-img"
                        src="${escapeHtml(player.img)}"
                        alt=""
                        loading="lazy"
                    >

                    <div class="player-info">

                        <div class="player-name">
                            ${escapeHtml(player.name)}
                        </div>

                        <div class="player-meta">
                            ${escapeHtml(player.rating)}
                            ·
                            ${escapeHtml(player.position)}
                            ·
                            ${escapeHtml(player.rarity)}
                        </div>

                    </div>

                    <div class="price">
                        ${formatPrice(player.price)}
                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </article>
            `;
        })
        .join("");

    document
        .querySelectorAll(".player")
        .forEach(element => {

            element.addEventListener("click", () => {

                const id = element.dataset.id;

                const player = players.find(
                    item => String(item.eaId) === String(id)
                );

                if (player) {
                    openPlayer(player);
                }

            });

        });
}


function openPlayer(player) {

    selectedPlayer = player;
    selectedPeriod = 6;

    homeEl.style.display = "none";
    detailEl.style.display = "block";

    detailImage.src = player.img || "";
    detailImage.alt = player.name || "";

    detailName.textContent = player.name || "";

    detailMeta.textContent =
        `${player.rating || ""} ${player.position || ""} · ` +
        `${player.club || ""} · ${player.rarity || ""}`;

    document
        .querySelectorAll(".tab")
        .forEach(tab => {
            tab.classList.toggle(
                "active",
                Number(tab.dataset.period) === selectedPeriod
            );
        });

    updateDetail();
}


function closePlayer() {

    selectedPlayer = null;

    detailEl.style.display = "none";
    homeEl.style.display = "block";
}


function getPlayerPoints(player) {

    if (!player) {
        return [];
    }

    const data = history[String(player.eaId)];

    if (!data || !Array.isArray(data.points)) {
        return [];
    }

    return data.points
        .map(point => ({
            timestamp: new Date(point.timestamp),
            price: Number(point.price)
        }))
        .filter(point =>
            !Number.isNaN(point.timestamp.getTime()) &&
            Number.isFinite(point.price) &&
            point.price > 0
        )
        .sort(
            (a, b) =>
                a.timestamp.getTime() -
                b.timestamp.getTime()
        );
}


function updateDetail() {

    if (!selectedPlayer) {
        return;
    }

    currentPrice.textContent =
        formatPrice(selectedPlayer.price);

    const points = getPlayerPoints(selectedPlayer);

    const cutoff =
        Date.now() -
        selectedPeriod * 60 * 60 * 1000;

    const filtered = points.filter(
        point =>
            point.timestamp.getTime() >= cutoff
    );

    updateChange(filtered);

    drawChart(filtered);
}


function updateChange(points) {

    if (points.length < 2) {

        changeEl.textContent =
            "Collecting price history...";

        changeEl.className =
            "change neutral";

        return;
    }

    const first = points[0].price;
    const last =
        selectedPlayer.price ||
        points[points.length - 1].price;

    if (!first || !last) {
        return;
    }

    const percent =
        ((last - first) / first) * 100;

    const rounded =
        percent.toFixed(2);

    if (percent > 0) {

        changeEl.textContent =
            `▲ +${rounded}%`;

        changeEl.className =
            "change up";

    } else if (percent < 0) {

        changeEl.textContent =
            `▼ ${rounded}%`;

        changeEl.className =
            "change down";

    } else {

        changeEl.textContent =
            "● 0.00%";

        changeEl.className =
            "change neutral";
    }
}


function drawChart(points) {

    chart.innerHTML = "";

    if (points.length < 2) {

        chart.innerHTML = `
            <text
                x="300"
                y="115"
                text-anchor="middle"
                class="chart-label"
            >
                Not enough history yet
            </text>
        `;

        return;
    }

    const width = 600;
    const height = 230;

    const paddingLeft = 12;
    const paddingRight = 12;
    const paddingTop = 20;
    const paddingBottom = 28;

    const chartWidth =
        width - paddingLeft - paddingRight;

    const chartHeight =
        height - paddingTop - paddingBottom;

    const values =
        points.map(point => point.price);

    let min =
        Math.min(...values);

    let max =
        Math.max(...values);

    if (min === max) {
        min -= 1;
        max += 1;
    }

    const range = max - min;

    // Grid

    for (let i = 0; i < 4; i++) {

        const y =
            paddingTop +
            (chartHeight * i / 3);

        chart.insertAdjacentHTML(
            "beforeend",
            `
                <line
                    x1="${paddingLeft}"
                    x2="${width - paddingRight}"
                    y1="${y}"
                    y2="${y}"
                    class="chart-grid"
                />
            `
        );
    }

    const coordinates =
        points.map((point, index) => {

            const x =
                paddingLeft +
                (index / (points.length - 1)) *
                chartWidth;

            const y =
                paddingTop +
                (1 -
                    (point.price - min) / range
                ) *
                chartHeight;

            return { x, y };
        });

    const linePath =
        coordinates
            .map(
                (point, index) =>
                    `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
            )
            .join(" ");

    const areaPath =
        `${linePath}
         L ${coordinates[coordinates.length - 1].x} ${height - paddingBottom}
         L ${coordinates[0].x} ${height - paddingBottom}
         Z`;

    chart.insertAdjacentHTML(
        "beforeend",
        `
            <defs>
                <linearGradient
                    id="areaGradient"
                    x1="0"
                    x2="0"
                    y1="0"
                    y2="1"
                >
                    <stop
                        offset="0%"
                        stop-color="#00e5ff"
                        stop-opacity=".35"
                    />
                    <stop
                        offset="100%"
                        stop-color="#00e5ff"
                        stop-opacity="0"
                    />
                </linearGradient>
            </defs>

            <path
                d="${areaPath}"
                class="chart-area"
            />

            <path
                d="${linePath}"
                class="chart-line"
            />
        `
    );

    // Ultimo punto

    const last =
        coordinates[coordinates.length - 1];

    chart.insertAdjacentHTML(
        "beforeend",
        `
            <circle
                cx="${last.x}"
                cy="${last.y}"
                r="4"
                class="chart-point"
            />
        `
    );
}


document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener("click", () => {

            selectedPeriod =
                Number(tab.dataset.period);

            document
                .querySelectorAll(".tab")
                .forEach(item => {
                    item.classList.toggle(
                        "active",
                        item === tab
                    );
                });

            updateDetail();
        });

    });


document
    .getElementById("backBtn")
    .addEventListener("click", closePlayer);


document
    .getElementById("refreshBtn")
    .addEventListener("click", async () => {

        const button =
            document.getElementById("refreshBtn");

        button.textContent = "Updating...";

        await loadData();

        button.textContent = "Refresh";
    });


loadData();
</script>

</body>
</html>
