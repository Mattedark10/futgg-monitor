<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FutFlex</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#0b0709;
  --card:#150e11;
  --line:#2a1a1f;
  --red:#ff2d4a;
  --tx:#fff;
  --mu:#9a8a8f;
}

*{
  box-sizing:border-box;
  margin:0;
}

body{
  background:var(--bg);
  color:var(--tx);
  font-family:system-ui,sans-serif;
  padding:0 14px calc(env(safe-area-inset-bottom,0px) + 24px);
}

h1{
  font-size:34px;
  line-height:1;
  margin:22px 0 6px;
  letter-spacing:-1px;
}

.sub{
  color:var(--mu);
  font-size:13px;
  margin-bottom:16px;
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:16px 0 10px;
}

.bar b{
  font-size:17px;
}

.bar small{
  display:block;
  color:var(--mu);
  font-size:12px;
  margin-top:2px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:8px;
  cursor:pointer;
}

.item:active{
  transform:scale(.99);
}

.rk{
  color:var(--mu);
  font-size:12px;
  width:26px;
  flex:none;
}

.ph{
  width:58px;
  height:76px;
  object-fit:contain;
  flex:none;
}

.info{
  min-width:0;
  flex:1;
}

.nm{
  font-weight:700;
  font-size:16px;
}

.rt{
  color:var(--red);
  font-size:12px;
  font-weight:700;
}

.cd{
  color:var(--mu);
  font-size:12px;
  margin-top:2px;
}

.club{
  color:var(--mu);
  font-size:11px;
  margin-top:4px;
}

.empty{
  color:var(--mu);
  text-align:center;
  padding:30px 0;
}

.refresh{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--tx);
  border-radius:99px;
  padding:8px 14px;
  font-size:14px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>FutFlex</h1>

<p class="sub" id="sub">
  Loading Trending Players...
</p>

<button class="refresh" id="ref">
  ⟳ Refresh
</button>

<div class="bar">
  <div>
    <b>Trending Players</b>
    <small id="count"></small>
  </div>
</div>

<div id="list"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

let players = [];

const esc = s =>
  String(s ?? "").replace(
    /[&<>"]/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[c])
  );

function render() {
  document.getElementById("count").textContent =
    players.length + " players";

  if (!players.length) {
    document.getElementById("list").innerHTML =
      `<p class="empty">No players available.</p>`;
    return;
  }

  document.getElementById("list").innerHTML =
    players.map((p, i) => `
      <div
        class="item"
        data-url="${esc(p.url)}"
      >

        <span class="rk">
          #${i + 1}
        </span>

        ${
          p.img
            ? `<img
                class="ph"
                src="${esc(p.img)}"
                alt="${esc(p.name)}"
                loading="lazy"
              >`
            : `<div class="ph"></div>`
        }

        <div class="info">

          <div class="rt">
            ${esc(p.rating)}
            ${esc(p.position)}
          </div>

          <div class="nm">
            ${esc(p.name)}
          </div>

          <div class="cd">
            ${esc(p.rarity)}
          </div>

          <div class="club">
            ${esc(p.club)}
          </div>

        </div>

      </div>
    `).join("");

  document.querySelectorAll(".item").forEach(item => {
    item.addEventListener("click", () => {
      const url = item.dataset.url;

      if (!url) return;

      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    });
  });
}

async function load() {
  const sub = document.getElementById("sub");

  sub.textContent = "Loading Trending Players...";

  try {
    const response = await fetch(
      "trending.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    players = Array.isArray(data)
      ? data.slice(0, 20)
      : [];

    sub.textContent = "Live data from FUT.GG";

  } catch (error) {
    console.error(error);

    players = [];

    sub.textContent = "Unable to load Trending Players";
  }

  render();
}

document.getElementById("ref").onclick = load;

load();
</script>

</body>
</html>
